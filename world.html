<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="극단 창파의 해외 초청 공연 자료 아카이브. 프라하와 브라쇼브의 두드리 두드리 초청 기록을 소개합니다."
    />
    <title>해외 초청 공연 | 극단 창파</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="world-body">
    <main class="world-page">
      <a class="world-back" href="./index.html">창파 메인으로</a>

      <section class="world-hero" aria-labelledby="world-title">
        <div>
          <p class="eyebrow">World archive</p>
          <h1 id="world-title">해외 초청 공연</h1>
          <p>
            창파의 무대가 다른 도시의 프로그램과 기록 속에 남은 장면을
            모읍니다.
          </p>
        </div>
        <div class="world-hero-mark" aria-hidden="true">
          <span>Guest stages</span>
          <b>두드리<br />두드리</b>
        </div>
      </section>

      <section class="world-lead" aria-labelledby="world-record-title">
        <p class="eyebrow">Invited records</p>
        <h2 id="world-record-title">프라하와 브라쇼브</h2>
        <p>
          해외 초청 공연 자료는 공연 사진뿐 아니라 프로그램북, 일정표,
          현지 소개문까지 함께 보여 주는 별도 챕터로 확장할 수 있습니다.
        </p>
      </section>

      <section class="world-records" aria-label="해외 공연 자료">
        <figure class="world-record">
          <img
            src="./images/world/프라하두드리두드리1.jpg"
            alt="프라하 2009 국제 축제 프로그램 카탈로그에 실린 두드리 두드리 일정"
          />
          <figcaption>
            <b>Prague 2009</b>
            <span>프로그램 카탈로그</span>
          </figcaption>
        </figure>
        <figure class="world-record">
          <img
            src="./images/world/프라하두드리두드리.jpg"
            alt="프라하 초청 자료에 실린 극단 창파 두드리 두드리 소개 지면"
          />
          <figcaption>
            <b>Prague 2009</b>
            <span>초청 소개 지면</span>
          </figcaption>
        </figure>
        <figure class="world-record">
          <img
            src="./images/world/브라소브두드리두드리2.jpg"
            alt="브라쇼브 두드리 두드리 해외 공연 자료"
          />
          <figcaption>
            <b>Brasov</b>
            <span>해외 초청 기록</span>
          </figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
